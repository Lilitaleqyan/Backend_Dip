spring.application.name=Backend_Dip
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.servlet.multipart.enabled=true
spring.data.jdbc.dialect=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
server.port=8181
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
logging.level.org.springframework.mail=ERROR
logging.level.com.sun.mail=ERROR
logging.level.javax.mail=ERROR
file.upload-dir=/home/user/IdeaProjects/Backend_Dip/uploads

spring.servlet.multipart.max-file-size=280MB
spring.servlet.multipart.max-request-size=2800MB
openai.api.key=${API_KEY}
openai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=
cors.allowed-origins=http://localhost:5000,http://127.0.0.1:5000
server.tomcat.connection-timeout=60000
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=Authorization,Content-Type
cors.allow-credentials=true

spring.mail.host=smtp.gmail.com
spring.mail.properties.mail.debug=false
spring.mail.port=587
spring.mail.username=${MAIL}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000